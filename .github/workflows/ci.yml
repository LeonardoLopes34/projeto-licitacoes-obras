name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: pip check
      - run: ruff check backend
      - run: pytest
      - name: Validate migrations in an isolated SQLite database
        run: |
          export APP_ENV=test
          export DATABASE_URL="sqlite:///${RUNNER_TEMP}/licitacoes-ci.db"
          alembic upgrade head
          alembic check

  migration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        # Banco descartável do CI: sem senha (trust), para não haver credencial no repositório.
        env:
          POSTGRES_USER: licitacoes
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: licitacoes
        options: >-
          --health-cmd "pg_isready -U licitacoes -d licitacoes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - name: Upgrade and compare the isolated PostgreSQL schema
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg2://licitacoes@127.0.0.1:5432/licitacoes
          PGVECTOR_TEST_DATABASE_URL: postgresql+psycopg2://licitacoes@127.0.0.1:5432/licitacoes
        run: |
          alembic upgrade head
          alembic check
          pytest backend/tests/integration/test_pgvector_integration.py

  frontend:
    runs-on: ubuntu-latest
    # src/config.js exige VITE_API_URL; no CI não há .env, então a URL de desenvolvimento vem daqui.
    env:
      VITE_API_URL: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - name: Block tracked Python bytecode
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo 'Python bytecode must not be tracked.'
            exit 1
          fi
      - name: Block disabled TLS verification
        run: |
          if grep -RInE 'verify[[:space:]]*=[[:space:]]*False|_create_unverified_context' --include='*.py' backend test_pncp.py; then
            echo 'Disabled TLS verification is not allowed.'
            exit 1
          fi
